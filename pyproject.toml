[project]
name = "archipelago-notifs-discord"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Alex Phillips", email = "alecks.phillips@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.12.15",
    "aiosignal==1.4.0",
    "async-timeout==5.0.1",
    "attrs==25.3.0",
    "certifi==2025.8.3",
    "charset-normalizer==3.4.3",
    "discord==2.3.2",
    "discord-py==2.6.2",
    "frozenlist==1.7.0",
    "idna==3.10",
    "loguru>=0.7.3",
    "lxml==6.0.1",
    "multidict==6.6.4",
    "numpy==2.3.4",
    "propcache==0.3.2",
    "python-dotenv==1.2.2",
    "requests==2.32.5",
    "typing-extensions==4.15.0",
    "urllib3==2.5.0",
    "yarl==1.20.1",
]

[project.scripts]
archipelago-notifs-discord = "archipelago_notifs_discord:main"

[build-system]
